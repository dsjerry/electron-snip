<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' ws://localhost:* ws://127.0.0.1:* http://localhost:* http://127.0.0.1:*"
    />
    <title>record</title>
    <link rel="stylesheet" href="./record.css" />
  </head>
  <body>
    <div class="bar">
      <div class="status">
        <span id="time">00:00</span>
        <span id="hint">准备中…</span>
      </div>
      <div class="actions">
        <button id="pause" type="button" title="暂停 / 继续">暂停</button>
        <button id="stop" type="button" class="primary" title="停止并导出">停止</button>
        <button id="cancel" type="button" class="danger" title="取消（Esc）">取消</button>
      </div>
    </div>
    <script src="./record.js"></script>
  </body>
</html>
